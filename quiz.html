<!-- QUIZ NIGHT — endless AI trivia arcade -->
<style>
  :root{
    --bg:#12101C;
    --surface:#1C1830;
    --surface-alt:#241F3D;
    --border:rgba(255,255,255,0.08);
    --text:#F5F3FF;
    --muted:#9B96BB;
    --gold:#F5B700;
    --teal:#00C2A8;
    --coral:#FF5470;
    --mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
  }
  *{box-sizing:border-box;}
  #qn-root{
    background:radial-gradient(1200px 700px at 50% -10%, #241F3D 0%, #12101C 55%, #0C0A15 100%);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:640px;
    padding:28px 20px 40px;
    border-radius:16px;
    position:relative;
    overflow:hidden;
  }
  #qn-root *{box-sizing:border-box;}
  .qn-marquee{
    font-weight:800;
    letter-spacing:0.06em;
    text-transform:uppercase;
    text-align:center;
  }
  .qn-title{
    font-size:38px;
    letter-spacing:0.08em;
    background:linear-gradient(90deg,#FF5470,#F5B700 50%,#00C2A8);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    text-shadow:0 0 40px rgba(245,183,0,0.15);
    margin:0 0 4px;
  }
  .qn-sub{
    text-align:center;
    color:var(--muted);
    font-size:13px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    margin-bottom:28px;
  }
  .qn-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:18px;
    padding:26px;
    box-shadow:0 20px 50px rgba(0,0,0,0.35);
  }
  .qn-screen{max-width:520px;margin:0 auto;animation:qnFade .35s ease;}
  @keyframes qnFade{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
  .qn-input{
    width:100%;
    background:var(--surface-alt);
    border:1px solid var(--border);
    color:var(--text);
    padding:14px 16px;
    border-radius:10px;
    font-size:16px;
    outline:none;
    margin-bottom:14px;
  }
  .qn-input:focus{border-color:var(--gold);}
  .qn-btn{
    display:block;
    width:100%;
    padding:14px 18px;
    border-radius:10px;
    border:none;
    font-weight:700;
    font-size:15px;
    letter-spacing:0.03em;
    cursor:pointer;
    transition:transform .12s ease, filter .12s ease;
  }
  .qn-btn:hover{filter:brightness(1.08);}
  .qn-btn:active{transform:scale(0.98);}
  .qn-btn-primary{background:linear-gradient(90deg,#F5B700,#FF9F1C);color:#1A1400;}
  .qn-btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text);}
  .qn-btn:disabled{opacity:0.5;cursor:not-allowed;}
  .qn-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-top:18px;
  }
  .qn-cat-tile{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:14px;
    padding:16px 14px;
    cursor:pointer;
    text-align:left;
    border-left:4px solid var(--cat-color, var(--gold));
    transition:transform .12s ease, background .12s ease;
  }
  .qn-cat-tile:hover{transform:translateY(-2px);background:var(--surface-alt);}
  .qn-cat-emoji{font-size:26px;display:block;margin-bottom:8px;}
  .qn-cat-name{font-weight:700;font-size:15px;}
  .qn-cat-best{color:var(--muted);font-size:11px;margin-top:4px;font-family:var(--mono);}
  .qn-topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:18px;
    font-size:13px;
    color:var(--muted);
  }
  .qn-topbar b{color:var(--text);}
  .qn-scoreboard{
    display:flex;
    justify-content:center;
    gap:6px;
    margin:10px 0 22px;
  }
  .qn-digit{
    width:34px;height:44px;
    background:#0C0A15;
    border:1px solid var(--border);
    border-radius:6px;
    display:flex;align-items:center;justify-content:center;
    font-family:var(--mono);
    font-size:24px;
    font-weight:700;
    color:var(--teal);
    box-shadow:inset 0 0 10px rgba(0,194,168,0.15);
  }
  .qn-question{
    font-size:19px;
    font-weight:600;
    line-height:1.45;
    margin-bottom:20px;
    min-height:70px;
  }
  .qn-options{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .qn-opt{
    background:var(--surface-alt);
    border:1px solid var(--border);
    color:var(--text);
    padding:16px 12px;
    border-radius:12px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    text-align:center;
    transition:transform .12s ease, background .15s ease, border-color .15s ease;
  }
  .qn-opt:hover:not(:disabled){transform:translateY(-2px);border-color:var(--gold);}
  .qn-opt:disabled{cursor:default;}
  .qn-opt.correct{background:rgba(0,194,168,0.18);border-color:var(--teal);color:var(--teal);}
  .qn-opt.wrong{background:rgba(255,84,112,0.18);border-color:var(--coral);color:var(--coral);}
  .qn-opt.dim{opacity:0.4;}
  .qn-loading{
    text-align:center;color:var(--muted);font-size:14px;padding:40px 0;
  }
  .qn-spinner{
    width:26px;height:26px;border-radius:50%;
    border:3px solid var(--border);border-top-color:var(--gold);
    margin:0 auto 12px;
    animation:qnSpin 0.8s linear infinite;
  }
  @keyframes qnSpin{to{transform:rotate(360deg);}}
  .qn-result-score{
    text-align:center;font-size:64px;font-weight:800;font-family:var(--mono);
    color:var(--gold);margin:6px 0 2px;text-shadow:0 0 30px rgba(245,183,0,0.35);
  }
  .qn-result-label{text-align:center;color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:0.1em;margin-bottom:22px;}
  .qn-row{display:flex;gap:10px;}
  .qn-row .qn-btn{flex:1;}
  .qn-back{
    background:none;border:none;color:var(--muted);cursor:pointer;font-size:13px;
    display:flex;align-items:center;gap:4px;margin-bottom:14px;padding:0;
  }
  .qn-back:hover{color:var(--text);}
  .qn-lb-row{
    display:flex;justify-content:space-between;align-items:center;
    padding:11px 4px;border-bottom:1px solid var(--border);font-size:14px;
  }
  .qn-lb-row:last-child{border-bottom:none;}
  .qn-lb-rank{color:var(--muted);font-family:var(--mono);width:24px;display:inline-block;}
  .qn-lb-score{font-family:var(--mono);font-weight:700;color:var(--teal);}
  .qn-error{
    background:rgba(255,84,112,0.12);border:1px solid var(--coral);color:var(--coral);
    padding:12px 14px;border-radius:10px;font-size:13px;margin-bottom:14px;
  }
  .qn-funfact{
    margin-top:16px;padding:12px 14px;background:var(--surface-alt);border-radius:10px;
    font-size:12.5px;color:var(--muted);border-left:3px solid var(--gold);
  }
  select.qn-input{appearance:none;}
  .qn-timer-row{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
  .qn-timer-track{
    flex:1;height:8px;border-radius:4px;background:var(--surface-alt);overflow:hidden;
    border:1px solid var(--border);
  }
  .qn-timer-bar{
    height:100%;width:100%;background:var(--teal);border-radius:4px;
    transition:width 1s linear, background .3s ease;
  }
  .qn-timer-num{
    font-family:var(--mono);font-weight:700;font-size:15px;color:var(--text);
    width:22px;text-align:right;
  }
  .qn-timeout{
    background:rgba(255,84,112,0.12);border:1px solid var(--coral);color:var(--coral);
    padding:8px 12px;border-radius:8px;font-size:13px;margin-bottom:14px;text-align:center;font-weight:700;
  }
  .qn-share-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px;}
  .qn-share-btn{
    display:flex;flex-direction:column;align-items:center;gap:4px;
    padding:12px 6px;border-radius:10px;border:1px solid var(--border);
    background:var(--surface-alt);color:var(--text);cursor:pointer;font-size:11px;font-weight:700;
    transition:transform .12s ease, filter .12s ease;
  }
  .qn-share-btn:hover{transform:translateY(-2px);filter:brightness(1.1);}
  .qn-share-emoji{font-size:20px;}
  .qn-auth-tabs{
    display:flex;gap:4px;margin-bottom:18px;background:var(--surface-alt);
    border-radius:10px;padding:4px;
  }
  .qn-auth-tab{
    flex:1;padding:9px 0;border:none;border-radius:8px;background:transparent;
    color:var(--muted);font-weight:700;font-size:13px;cursor:pointer;transition:all .15s ease;
  }
  .qn-auth-tab.active{background:var(--gold);color:#1A1400;}
  .qn-field-label{
    font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em;
    margin-bottom:6px;display:block;
  }
  .qn-hint{font-size:11.5px;color:var(--muted);margin:-8px 0 14px;}
</style>

<div id="qn-root"></div>

<script>
(function(){
  const root = document.getElementById('qn-root');

  const CATEGORIES = [
    {id:'movies', name:'Movies', emoji:'🎬', color:'#FF5470'},
    {id:'cricket', name:'Cricket', emoji:'🏏', color:'#00C2A8'},
    {id:'football', name:'Football', emoji:'⚽', color:'#4ADE80'},
    {id:'music', name:'Music', emoji:'🎵', color:'#C77DFF'},
    {id:'technology', name:'Technology', emoji:'💻', color:'#4EA8DE'},
    {id:'science', name:'Science', emoji:'🔬', color:'#F5B700'},
    {id:'facts', name:'Random Facts', emoji:'✨', color:'#FF9F1C'},
    {id:'gk', name:'General Knowledge', emoji:'🧠', color:'#5AD2F4'},
    {id:'history', name:'History', emoji:'🏛️', color:'#E4572E'},
    {id:'geography', name:'Geography', emoji:'🌍', color:'#70E000'},
  ];

  const TIME_LIMIT = 15;

  let state = {
    screen: 'login',
    username: null,
    authMode: 'login',
    authError: null,
    authBusy: false,
    category: null,
    score: 0,
    askedQuestions: [],
    currentQ: null,
    loading: false,
    timeLeft: TIME_LIMIT,
    timerInterval: null,
    timedOut: false,
    error: null,
    revealIndex: null, // index user picked, for showing correct/wrong
    bestScores: {}, // category -> this user's best (from shared storage)
    leaderboard: [], // for leaderboard screen
  };

  function esc(s){
    const d = document.createElement('div');
    d.innerText = s == null ? '' : String(s);
    return d.innerHTML;
  }

  async function safeGet(key, shared){
    try{
      const r = await window.storage.get(key, !!shared);
      return r ? r.value : null;
    }catch(e){ return null; }
  }
  async function safeSet(key, value, shared){
    try{ await window.storage.set(key, value, !!shared); }catch(e){}
  }

  // ---------- Persistence helpers ----------
  async function loadUser(){
    const u = await safeGet('qn:currentUser', false);
    if(u){ state.username = u; }
  }
  async function saveUser(name){
    state.username = name;
    await safeSet('qn:currentUser', name, false);
  }
  async function logout(){
    state.username = null;
    state.authMode = 'login';
    state.authError = null;
    try{ await window.storage.delete('qn:currentUser', false); }catch(e){}
    state.screen = 'login';
    render();
  }

  async function hashPassword(pw){
    const enc = new TextEncoder().encode(pw);
    const buf = await crypto.subtle.digest('SHA-256', enc);
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
  }

  const USERNAME_RE = /^[a-zA-Z0-9_]{3,20}$/;
  const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

  // Returns {ok:true, username} or {ok:false, error}
  async function signUp(username, email, password, confirmPassword){
    username = (username || '').trim();
    email = (email || '').trim();
    if(!username || !email || !password || !confirmPassword){
      return {ok:false, error:'Fill in every field to create an account.'};
    }
    if(!USERNAME_RE.test(username)){
      return {ok:false, error:'Username must be 3-20 characters: letters, numbers, or underscores only.'};
    }
    if(!EMAIL_RE.test(email)){
      return {ok:false, error:'Enter a valid email address.'};
    }
    if(password.length < 6){
      return {ok:false, error:'Password must be at least 6 characters.'};
    }
    if(password !== confirmPassword){
      return {ok:false, error:'Passwords do not match.'};
    }
    const usernameLower = username.toLowerCase();
    const emailLower = email.toLowerCase();

    const existingUser = await safeGet('qn:users:' + usernameLower, true);
    if(existingUser){
      return {ok:false, error:'That username is taken — pick another one.'};
    }
    const existingEmail = await safeGet('qn:emails:' + emailLower, true);
    if(existingEmail){
      return {ok:false, error:'That email is already registered. Try logging in instead.'};
    }

    const passwordHash = await hashPassword(password);
    const record = {username, email, passwordHash, createdAt: Date.now()};
    await safeSet('qn:users:' + usernameLower, JSON.stringify(record), true);
    await safeSet('qn:emails:' + emailLower, usernameLower, true);
    await saveUser(username);
    return {ok:true, username};
  }

  // Returns {ok:true, username} or {ok:false, error}
  async function logIn(identifier, password){
    identifier = (identifier || '').trim();
    if(!identifier || !password){
      return {ok:false, error:'Enter your username/email and password.'};
    }
    let usernameLower;
    if(identifier.includes('@')){
      usernameLower = await safeGet('qn:emails:' + identifier.toLowerCase(), true);
      if(!usernameLower){
        return {ok:false, error:'No account found with that email.'};
      }
    } else {
      usernameLower = identifier.toLowerCase();
    }
    const raw = await safeGet('qn:users:' + usernameLower, true);
    if(!raw){
      return {ok:false, error:'No account found with that username.'};
    }
    let record;
    try{ record = JSON.parse(raw); }catch(e){ return {ok:false, error:'Account data is corrupted. Please sign up again.'}; }
    const hash = await hashPassword(password);
    if(hash !== record.passwordHash){
      return {ok:false, error:'Incorrect password.'};
    }
    await saveUser(record.username);
    return {ok:true, username: record.username};
  }

  async function getCategoryScores(catId){
    const raw = await safeGet('qn:scores:' + catId, true);
    if(!raw) return [];
    try{ return JSON.parse(raw); }catch(e){ return []; }
  }
  async function saveCategoryScore(catId, username, score){
    let list = await getCategoryScores(catId);
    list.push({username, score, ts: Date.now()});
    list.sort((a,b)=> b.score - a.score);
    list = list.slice(0, 25);
    await safeSet('qn:scores:' + catId, JSON.stringify(list), true);
    return list;
  }

  // ---------- AI question generation ----------
  async function fetchQuestion(catName, streak, asked){
    const recent = asked.slice(-15);
    const system = `You are a trivia question generator API. Respond with ONLY a raw JSON object — no markdown, no code fences, no commentary. Format exactly:
{"question": string, "options": [string,string,string,string], "correctIndex": number (0-3), "funFact": string}
Rules:
- Topic: ${catName}
- The current correct streak is ${streak}; scale difficulty up gently as the streak grows (streak 0-2 = easy, 3-6 = medium, 7+ = hard/obscure), but never make it a trick question.
- Exactly one option must be unambiguously correct.
- Keep the question under 25 words and each option under 6 words.
- funFact is one short sentence (under 20 words) revealed after the answer.
- Do NOT repeat or closely resemble any of these previously asked questions: ${JSON.stringify(recent)}
- Output valid JSON only.`;

    const body = {
      model: "claude-sonnet-4-6",
      max_tokens: 1000,
      system: system,
      messages: [{ role: "user", content: "Generate the next question now." }]
    };

    let lastErr = null;
    for(let attempt=0; attempt<3; attempt++){
      try{
        const res = await fetch("https://api.anthropic.com/v1/messages", {
          method:"POST",
          headers:{"Content-Type":"application/json"},
          body: JSON.stringify(body)
        });
        const data = await res.json();
        const textBlock = (data.content || []).map(c=>c.text||'').join('\n');
        const start = textBlock.indexOf('{');
        const end = textBlock.lastIndexOf('}');
        if(start === -1 || end === -1) throw new Error('no json found');
        const parsed = JSON.parse(textBlock.slice(start, end+1));
        if(!parsed.question || !Array.isArray(parsed.options) || parsed.options.length !== 4 || typeof parsed.correctIndex !== 'number'){
          throw new Error('malformed json');
        }
        return parsed;
      }catch(e){
        lastErr = e;
      }
    }
    throw lastErr || new Error('failed to generate question');
  }

  // ---------- Rendering ----------
  function render(){
    if(state.screen === 'login') return renderLogin();
    if(state.screen === 'categories') return renderCategories();
    if(state.screen === 'quiz') return renderQuiz();
    if(state.screen === 'result') return renderResult();
    if(state.screen === 'leaderboard') return renderLeaderboard();
  }

  function renderLogin(){
    const mode = state.authMode;
    const errorHtml = state.authError ? `<div class="qn-error">${esc(state.authError)}</div>` : '';
    let fieldsHtml;
    if(mode === 'login'){
      fieldsHtml = `
        <label class="qn-field-label" for="qn-id-input">Username or email</label>
        <input id="qn-id-input" class="qn-input" placeholder="e.g. quizmaster or you@email.com" autocomplete="username"/>
        <label class="qn-field-label" for="qn-pw-input">Password</label>
        <input id="qn-pw-input" type="password" class="qn-input" placeholder="Password" autocomplete="current-password"/>
        <button class="qn-btn qn-btn-primary" id="qn-submit-btn">Log in</button>
      `;
    } else {
      fieldsHtml = `
        <label class="qn-field-label" for="qn-username-input">Username</label>
        <input id="qn-username-input" class="qn-input" placeholder="Pick a unique username" maxlength="20" autocomplete="username"/>
        <div class="qn-hint">3-20 characters: letters, numbers, underscores. Must be unique.</div>
        <label class="qn-field-label" for="qn-email-input">Email</label>
        <input id="qn-email-input" type="email" class="qn-input" placeholder="you@email.com" autocomplete="email"/>
        <label class="qn-field-label" for="qn-pw-input">Password</label>
        <input id="qn-pw-input" type="password" class="qn-input" placeholder="At least 6 characters" autocomplete="new-password"/>
        <label class="qn-field-label" for="qn-pw2-input">Confirm password</label>
        <input id="qn-pw2-input" type="password" class="qn-input" placeholder="Re-enter password" autocomplete="new-password"/>
        <button class="qn-btn qn-btn-primary" id="qn-submit-btn">Create account</button>
      `;
    }
    root.innerHTML = `
      <div class="qn-screen" style="padding-top:40px;">
        <div class="qn-marquee qn-title">Quiz Night</div>
        <div class="qn-sub">Endless AI Trivia · One Wrong Answer Ends It</div>
        <div class="qn-card">
          <div class="qn-auth-tabs">
            <button class="qn-auth-tab ${mode==='login' ? 'active' : ''}" data-mode="login">Log in</button>
            <button class="qn-auth-tab ${mode==='signup' ? 'active' : ''}" data-mode="signup">Sign up</button>
          </div>
          ${errorHtml}
          ${fieldsHtml}
        </div>
      </div>
    `;
    document.querySelectorAll('.qn-auth-tab').forEach(tab=>{
      tab.addEventListener('click', ()=>{
        state.authMode = tab.dataset.mode;
        state.authError = null;
        render();
      });
    });
    const submitBtn = document.getElementById('qn-submit-btn');
    const runSubmit = async ()=>{
      if(state.authBusy) return;
      state.authBusy = true;
      state.authError = null;
      submitBtn.disabled = true;
      const originalLabel = submitBtn.textContent;
      submitBtn.textContent = mode === 'login' ? 'Logging in…' : 'Creating account…';
      let result;
      if(mode === 'login'){
        const id = document.getElementById('qn-id-input').value;
        const pw = document.getElementById('qn-pw-input').value;
        result = await logIn(id, pw);
      } else {
        const uname = document.getElementById('qn-username-input').value;
        const email = document.getElementById('qn-email-input').value;
        const pw = document.getElementById('qn-pw-input').value;
        const pw2 = document.getElementById('qn-pw2-input').value;
        result = await signUp(uname, email, pw, pw2);
      }
      state.authBusy = false;
      if(result.ok){
        state.authError = null;
        state.screen = 'categories';
        render();
      } else {
        state.authError = result.error;
        render();
      }
    };
    submitBtn.addEventListener('click', runSubmit);
    root.querySelectorAll('.qn-input').forEach(inp=>{
      inp.addEventListener('keydown', (e)=>{ if(e.key === 'Enter') runSubmit(); });
    });
  }

  async function renderCategories(){
    root.innerHTML = `
      <div class="qn-screen">
        <div class="qn-topbar">
          <div>Playing as <b>${esc(state.username)}</b></div>
          <button class="qn-back" id="qn-switch-user">Log out</button>
        </div>
        <div class="qn-marquee" style="font-size:22px;text-align:left;margin-bottom:2px;">Pick a category</div>
        <div class="qn-sub" style="text-align:left;margin-bottom:0;">Questions are freshly generated every round</div>
        <div class="qn-grid" id="qn-cat-grid">
          ${CATEGORIES.map(c => `
            <div class="qn-cat-tile" style="--cat-color:${c.color}" data-cat="${c.id}">
              <span class="qn-cat-emoji">${c.emoji}</span>
              <div class="qn-cat-name">${c.name}</div>
              <div class="qn-cat-best" id="best-${c.id}">best: —</div>
            </div>
          `).join('')}
        </div>
      </div>
    `;
    document.getElementById('qn-switch-user').addEventListener('click', logout);
    document.querySelectorAll('.qn-cat-tile').forEach(tile=>{
      tile.addEventListener('click', ()=> startQuiz(tile.dataset.cat));
    });
    // fill in best scores (async, non-blocking)
    CATEGORIES.forEach(async (c)=>{
      const list = await getCategoryScores(c.id);
      const mine = list.filter(s=>s.username === state.username).sort((a,b)=>b.score-a.score)[0];
      const top = list[0];
      const el = document.getElementById('best-' + c.id);
      if(!el) return;
      if(mine && top){
        el.textContent = `you: ${mine.score}  ·  top: ${top.score} (${top.username})`;
      } else if(top){
        el.textContent = `top: ${top.score} (${top.username})`;
      } else {
        el.textContent = 'be the first to play';
      }
    });
  }

  function clearTimer(){
    if(state.timerInterval){
      clearInterval(state.timerInterval);
      state.timerInterval = null;
    }
  }

  function startTimer(){
    clearTimer();
    state.timeLeft = TIME_LIMIT;
    updateTimerUI();
    state.timerInterval = setInterval(()=>{
      state.timeLeft -= 1;
      updateTimerUI();
      if(state.timeLeft <= 0){
        clearTimer();
        handleAnswer(null, true);
      }
    }, 1000);
  }

  function updateTimerUI(){
    const numEl = document.getElementById('qn-timer-num');
    const barEl = document.getElementById('qn-timer-bar');
    if(numEl) numEl.textContent = state.timeLeft;
    if(barEl){
      barEl.style.width = Math.max(0, (state.timeLeft / TIME_LIMIT) * 100) + '%';
      barEl.style.background = state.timeLeft <= 5 ? 'var(--coral)' : 'var(--teal)';
    }
  }

  async function startQuiz(catId){
    state.category = CATEGORIES.find(c=>c.id===catId);
    state.score = 0;
    state.askedQuestions = [];
    state.currentQ = null;
    state.revealIndex = null;
    state.error = null;
    state.timedOut = false;
    state.screen = 'quiz';
    state.loading = true;
    render();
    await nextQuestion();
  }

  async function nextQuestion(){
    clearTimer();
    state.loading = true;
    state.error = null;
    state.revealIndex = null;
    state.timedOut = false;
    render();
    try{
      const q = await fetchQuestion(state.category.name, state.score, state.askedQuestions);
      state.currentQ = q;
      state.askedQuestions.push(q.question);
      state.loading = false;
      render();
      startTimer();
    }catch(e){
      state.loading = false;
      state.error = "Couldn't generate a question. Check your connection and try again.";
      render();
    }
  }

  function renderQuiz(){
    const cat = state.category;
    const digits = String(state.score).padStart(2,'0').split('');
    let body = '';
    if(state.loading){
      body = `<div class="qn-loading"><div class="qn-spinner"></div>Cooking up a ${esc(cat.name)} question…</div>`;
    } else if(state.error){
      body = `<div class="qn-error">${esc(state.error)}</div>
              <button class="qn-btn qn-btn-primary" id="qn-retry">Try again</button>`;
    } else if(state.currentQ){
      const q = state.currentQ;
      body = `
        <div class="qn-timer-row">
          <div class="qn-timer-track"><div class="qn-timer-bar" id="qn-timer-bar"></div></div>
          <div class="qn-timer-num" id="qn-timer-num">${TIME_LIMIT}</div>
        </div>
        <div class="qn-question">${esc(q.question)}</div>
        <div class="qn-options" id="qn-options">
          ${q.options.map((opt,i)=>`<button class="qn-opt" data-i="${i}">${esc(opt)}</button>`).join('')}
        </div>
        <div id="qn-funfact"></div>
      `;
    }
    root.innerHTML = `
      <div class="qn-screen">
        <div class="qn-topbar">
          <button class="qn-back" id="qn-quit">← Bank score &amp; quit</button>
          <div style="color:${cat.color};font-weight:700;">${cat.emoji} ${esc(cat.name)}</div>
        </div>
        <div class="qn-scoreboard">
          ${digits.map(d=>`<div class="qn-digit">${d}</div>`).join('')}
        </div>
        <div class="qn-card">${body}</div>
      </div>
    `;
    const quitBtn = document.getElementById('qn-quit');
    if(quitBtn) quitBtn.addEventListener('click', ()=>{ clearTimer(); endQuiz('quit'); });
    const retryBtn = document.getElementById('qn-retry');
    if(retryBtn) retryBtn.addEventListener('click', nextQuestion);
    const optsWrap = document.getElementById('qn-options');
    if(optsWrap){
      optsWrap.querySelectorAll('.qn-opt').forEach(btn=>{
        btn.addEventListener('click', ()=> handleAnswer(parseInt(btn.dataset.i,10)));
      });
    }
  }

  function handleAnswer(i, timedOut){
    clearTimer();
    const q = state.currentQ;
    const opts = document.querySelectorAll('#qn-options .qn-opt');
    if(!opts.length) return;
    opts.forEach(b => b.disabled = true);
    const correct = !timedOut && i === q.correctIndex;
    opts[q.correctIndex].classList.add('correct');
    if(!correct && !timedOut){
      opts[i].classList.add('wrong');
    }
    opts.forEach((b, idx)=>{
      if(idx !== i && idx !== q.correctIndex) b.classList.add('dim');
    });
    if(timedOut){
      const ff = document.getElementById('qn-funfact');
      if(ff) ff.innerHTML = `<div class="qn-timeout">⏱ Time's up!</div>` + (q.funFact ? `<div class="qn-funfact">💡 ${esc(q.funFact)}</div>` : '');
    } else if(q.funFact){
      const ff = document.getElementById('qn-funfact');
      if(ff) ff.innerHTML = `<div class="qn-funfact">💡 ${esc(q.funFact)}</div>`;
    }
    if(correct){
      state.score += 1;
      setTimeout(()=>{ nextQuestion(); }, 1100);
    } else {
      setTimeout(()=>{ endQuiz(timedOut ? 'timeout' : 'wrong'); }, 1500);
    }
  }

  async function endQuiz(reason){
    clearTimer();
    let list = [];
    if(state.score > 0){
      list = await saveCategoryScore(state.category.id, state.username, state.score);
    } else {
      list = await getCategoryScores(state.category.id);
    }
    state.leaderboard = list;
    state.endReason = reason; // 'wrong' | 'timeout' | 'quit'
    state.screen = 'result';
    render();
  }

  function renderResult(){
    const cat = state.category;
    const top = state.leaderboard[0];
    const beatTop = top && state.score >= top.score;
    let msg;
    if(state.endReason === 'timeout'){
      msg = "Time's up — game over";
    } else if(state.endReason === 'wrong'){
      msg = 'Wrong answer — game over';
    } else {
      msg = 'Score banked';
    }
    let compareLine = '';
    if(top){
      if(beatTop && top.username === state.username){
        compareLine = `You're #1 in ${esc(cat.name)}. Own it.`;
      } else if(beatTop){
        compareLine = `New leader in ${esc(cat.name)}! You passed ${esc(top.username)} (${top.score}).`;
      } else {
        compareLine = `Top score in ${esc(cat.name)} is ${top.score} by ${esc(top.username)} — ${top.score - state.score} to beat it.`;
      }
    } else {
      compareLine = `First score ever logged in ${esc(cat.name)}.`;
    }
    root.innerHTML = `
      <div class="qn-screen" style="padding-top:20px;">
        <div class="qn-sub" style="margin-bottom:6px;">${esc(msg)} · ${cat.emoji} ${esc(cat.name)}</div>
        <div class="qn-result-score">${state.score}</div>
        <div class="qn-result-label">correct in a row</div>
        <div class="qn-card" style="margin-bottom:14px;">
          <div style="font-size:14px;margin-bottom:16px;">${compareLine}</div>
          <div class="qn-row">
            <button class="qn-btn qn-btn-primary" id="qn-again">Play again</button>
            <button class="qn-btn qn-btn-ghost" id="qn-copy">Copy challenge</button>
          </div>
          <div class="qn-share-row">
            <button class="qn-share-btn" id="qn-share-wa"><span class="qn-share-emoji">💬</span>WhatsApp</button>
            <button class="qn-share-btn" id="qn-share-x"><span class="qn-share-emoji">✕</span>X / Twitter</button>
            <button class="qn-share-btn" id="qn-share-ig"><span class="qn-share-emoji">📸</span>Instagram</button>
          </div>
        </div>
        <div class="qn-row">
          <button class="qn-btn qn-btn-ghost" id="qn-lb">View leaderboard</button>
          <button class="qn-btn qn-btn-ghost" id="qn-cats">All categories</button>
        </div>
      </div>
    `;
    const challengeText = `I scored ${state.score} in a row on ${cat.name} trivia in Quiz Night ${cat.emoji} Think you can beat me?`;
    document.getElementById('qn-again').addEventListener('click', ()=> startQuiz(cat.id));
    document.getElementById('qn-cats').addEventListener('click', ()=>{ state.screen='categories'; render(); });
    document.getElementById('qn-lb').addEventListener('click', ()=>{ state.screen='leaderboard'; render(); });
    document.getElementById('qn-copy').addEventListener('click', async ()=>{
      try{
        await navigator.clipboard.writeText(challengeText);
        const b = document.getElementById('qn-copy');
        b.textContent = 'Copied!';
        setTimeout(()=> b.textContent = 'Copy challenge', 1500);
      }catch(e){}
    });
    document.getElementById('qn-share-wa').addEventListener('click', ()=>{
      const url = 'https://wa.me/?text=' + encodeURIComponent(challengeText);
      window.open(url, '_blank');
    });
    document.getElementById('qn-share-x').addEventListener('click', ()=>{
      const url = 'https://twitter.com/intent/tweet?text=' + encodeURIComponent(challengeText);
      window.open(url, '_blank');
    });
    document.getElementById('qn-share-ig').addEventListener('click', async ()=>{
      try{ await navigator.clipboard.writeText(challengeText); }catch(e){}
      const b = document.getElementById('qn-share-ig');
      b.lastChild.textContent = ' Copied — paste it!';
      setTimeout(()=>{ window.open('https://www.instagram.com/', '_blank'); }, 400);
      setTimeout(()=>{ b.lastChild.textContent = ' Instagram'; }, 2500);
    });
  }

  function renderLeaderboard(){
    const cat = state.category;
    const rows = state.leaderboard.slice(0,10);
    root.innerHTML = `
      <div class="qn-screen" style="padding-top:20px;">
        <button class="qn-back" id="qn-lb-back">← Back</button>
        <div class="qn-marquee" style="font-size:20px;text-align:left;">${cat.emoji} ${esc(cat.name)} leaderboard</div>
        <div class="qn-card" style="margin-top:14px;">
          ${rows.length ? rows.map((r,i)=>`
            <div class="qn-lb-row">
              <span><span class="qn-lb-rank">${i+1}.</span>${esc(r.username)}${r.username===state.username ? ' <span style="color:var(--gold);font-size:11px;">(you)</span>' : ''}</span>
              <span class="qn-lb-score">${r.score}</span>
            </div>
          `).join('') : '<div style="color:var(--muted);font-size:13px;">No scores yet — be the first.</div>'}
        </div>
      </div>
    `;
    document.getElementById('qn-lb-back').addEventListener('click', ()=>{ state.screen='result'; render(); });
  }

  // //---------- Boot ----------
  (async function boot(){
    await loadUser();
    state.screen = state.username ? 'categories' : 'login';
    render();
  })();
})();
</script>
